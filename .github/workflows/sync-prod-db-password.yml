# One-off: write the rotated Supabase prod DB password into /etc/mimic42.env
# on the VPS and recreate the api container. The env file is never managed by
# the deploy pipeline (deploy.sh only writes IMAGE_TAG), so a password rotation
# needs this manual sync. Uses the same SSH setup as rollback.yml.
#
# Required: secrets PROD_DB_PASSWORD, DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER,
# DEPLOY_KNOWN_HOSTS; variables DEPLOY_PATH, DEPLOY_PORT.

name: Sync prod DB password

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Update env and recreate api
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ vars.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail

          ENV_FILE=/etc/mimic42.env
          backup="$ENV_FILE.bak.$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$ENV_FILE" "$backup"
          echo "backup: $backup"

          PROD_DB_PASSWORD='${{ secrets.PROD_DB_PASSWORD }}' python3 - <<'PY'
          import os
          import pathlib
          import re

          password = os.environ["PROD_DB_PASSWORD"]
          path = pathlib.Path("/etc/mimic42.env")
          text = path.read_text()
          pattern = re.compile(r"(DATABASE_CONNECTION_STRING=.*?://[^:/@\s]+:)[^@\s]+(@)")
          updated, count = pattern.subn(
              lambda m: m.group(1) + password + m.group(2), text, count=1
          )
          if count != 1:
              raise SystemExit(
                  f"DATABASE_CONNECTION_STRING password segment not found "
                  f"(replacements={count})"
              )
          path.write_text(updated)
          print("DATABASE_CONNECTION_STRING password updated")
          PY

          cd "${{ vars.DEPLOY_PATH }}"
          docker compose -f docker-compose.yml up -d --force-recreate api

          healthy=""
          for i in $(seq 1 36); do
            status="$(docker inspect --format '{{.State.Health.Status}}' mimic42-api 2>/dev/null || echo missing)"
            echo "api health: ${status} (attempt ${i})"
            if [ "${status}" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 5
          done
          [ -n "${healthy}" ]

          docker exec -i mimic42-api python - <<'PY'
          import asyncio
          import os

          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(os.environ["DATABASE_CONNECTION_STRING"])
              async with engine.connect() as conn:
                  result = await conn.exec_driver_sql("select 1")
                  print("db ok:", result.scalar())
              await engine.dispose()

          asyncio.run(main())
          PY
          REMOTE

      - name: Smoke test
        run: |
          set -e
          login_code=""
          for i in 1 2 3; do
            login_code="$(curl -s -o /dev/null -w '%{http_code}' https://mimic42.zomb.top/login)"
            echo "GET /login -> ${login_code} (attempt ${i})"
            test "${login_code}" = "200" && break
            sleep 10
          done
          test "${login_code}" = "200"
          api_code="$(curl -s -o /dev/null -w '%{http_code}' https://mimic42.zomb.top/api/v1/agents)"
          echo "GET /api/v1/agents -> ${api_code}"
          test "${api_code}" = "401" || test "${api_code}" = "403"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
