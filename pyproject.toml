[project]
name = "mimic42"
version = "0.1.0"
description = "Async Telegram userbot agent platform built with Telethon, LangChain, and FastAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "langchain>=1.3.1",
    "langchain-openrouter>=0.2.3",
    "mem0ai>=2.0.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.49",
    "supabase>=2.30.0",
    "telethon>=1.43.2",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimic42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Тесты против настоящей базы по умолчанию исключены: они занимают слот
# тестовых аккаунтов и чистят данные в общей Dev-базе. e2e поднимает серверы
# и браузер, real_tg требует настоящих Telegram-аккаунтов — оба слоя
# запускаются явно. Явный `-m db` (или e2e/real_tg) с командной строки
# перекрывает этот addopts и включает нужный слой.
addopts = ["-m", "not db and not e2e and not real_tg and not real_llm"]
markers = [
    "db: требует подключения к тестовой базе Mimic42 Dev",
    "e2e: поднимает тестовый сервер и фронт, гоняет браузерные сценарии",
    "real_tg: требует настоящих Telegram-аккаунтов, сети и секретов",
    "real_llm: ходит в настоящую модель через OpenRouter, тратит токены",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Скиллы вендорные: их хэши зафиксированы в skills-lock.json, правки по нашим правилам ломают синхронизацию.
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
output-format = "concise"
