# Bun configuration — https://bun.com/docs/test/configuration
[test]
# happy-dom globals must be registered before tests touch browser APIs
preload = ["./src/__tests__/setup.ts"]
# Next.js build output must not be scanned by `bun test`
# (browser e2e lives in the root `tests/e2e` and runs via pytest)
pathIgnorePatterns = [".next/**"]
